    <!-- tema antes da primeira pintura, para não piscar -->
    <script>
      ;(function () {
        var pref = 'auto'
        try {
          var s = JSON.parse(localStorage.getItem('ericmac.settings') || '{}')
          pref = (s.state && s.state.theme) || 'auto'
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <!-- tela de boot: pintada antes do JavaScript, o app remove quando estiver pronto -->
    <style>
      /* No Mac, 1rem acompanha a tela: uma fração da largura e da altura somada a uma
         parte da letra do navegador (em 1440×900 vale o padrão, a referência do design).
         Todo o layout é em rem, então a mesa cresce e encolhe junto. No celular fica a
         letra do sistema. A condição é a MOBILE_QUERY do App.tsx, negada. */
      @media (min-width:56.25em) and (not ((pointer:coarse) and (max-height:33.75em))){html{font-size:clamp(87.5%,calc(47.5% + .4vw + .3vh),150%)}}
      /* tablet com a cara do iPhone: um pouco maior, na mesma proporção */
      @media (min-width:37.5em) and (max-width:56.1875em) and (min-height:33.76em){html{font-size:clamp(100%,calc(75% + .75vw),125%)}}
      #boot{position:fixed;inset:0;z-index:20000;display:grid;place-content:center;justify-items:center;gap:3.5rem;background:#0b0b0a;color:#f5f5f7;transition:opacity .45s cubic-bezier(.22,1,.36,1)}
      #boot svg{width:7.5rem;height:auto;fill:none;stroke:currentColor;stroke-width:8;animation:boot-in .6s cubic-bezier(.22,1,.36,1) both}
      #boot i{display:block;width:11.25rem;height:.3125rem;border-radius:100vmax;background:rgba(255,255,255,.18);overflow:hidden}
      #boot i::after{content:'';display:block;height:100%;border-radius:inherit;background:#f5f5f7;transform-origin:left;transform:scaleX(var(--p,0));transition:transform .4s ease-out;animation:boot-bar 2.4s cubic-bezier(.2,.6,.3,1) both}
      #boot.is-done{opacity:0;pointer-events:none}
      #boot.is-done i::after{animation:none;transform:scaleX(1)}
      @keyframes boot-in{from{opacity:0;transform:scale(.92)}}
      @keyframes boot-bar{from{transform:scaleX(0)}to{transform:scaleX(.85)}}
      @media (prefers-reduced-motion:reduce){#boot svg,#boot i::after{animation:none}#boot{transition:none}}
    </style>
